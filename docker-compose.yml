services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livecart
      POSTGRES_PASSWORD: livecart
      POSTGRES_DB: livecart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livecart"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: http-server
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use Docker network hostname
      DATABASE_URL: postgres://livecart:livecart@postgres:5432/livecart?sslmode=disable
      # Redis on the Docker network for the asynq event queue
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tunnel:
    image: node:20-alpine
    command: >
      sh -c "npm install -g localtunnel &&
             echo '🚀 Starting tunnel to https://livecart-api.loca.lt' &&
             lt --port 3001 --subdomain livecart-api --local-host api"
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - dev

volumes:
  pgdata:
  redisdata:
