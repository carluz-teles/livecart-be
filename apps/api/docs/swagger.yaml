    properties:
      document:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  apps_api_internal_order.OrderDetailResponse:
    properties:
      alreadyPaidAmount:
        description: |-
          AlreadyPaidAmount / OutstandingAmount: a divisão do dinheiro do pedido.

          Um pedido não vira mais "pago" de uma vez só. Enquanto não foi faturado
          ele continua recebendo item, e o lojista despacha olhando para as duas
          metades: o que a compradora já pagou e o que ela ainda deve. Quando nada
          entrou depois do pagamento, outstandingAmount é 0 e a tela some com a
          divisão — que é o caso comum.
        type: integer
      cancellationRevertedAt:
        description: |-
          CancellationRevertedAt: quando presente, este pedido foi cancelado pela
          loja e mesmo assim foi pago — o cancelamento foi revertido e o pedido
          seguiu o fluxo normal. O FE mostra isso no histórico do pedido.
        type: string
      cancellationRevertedReason:
        description: |-
          CancellationRevertedReason distingue a origem da recuperação no histórico.
            'payment_won'  — o pagamento entrou depois do cancelamento
            'erp_reopened' — o lojista reabriu o pedido no ERP, à mão
            'tiny_approved_after_expiry' — aprovação Tiny reconhecida após expiração
        type: string
      comments:
        items:
          $ref: '#/definitions/apps_api_internal_order.OrderCommentResponse'
        type: array
      createdAt:
        type: string
      customer:
        $ref: '#/definitions/apps_api_internal_order.OrderCustomerResponse'
      customerBlocked:
        description: |-
          CustomerBlocked is true when the buyer's handle is currently blocked
          for this store. The FE uses it to render a "Cliente bloqueado" badge.
        type: boolean
      customerEmail:
        type: string
      customerHandle:
        type: string
      customerId:
        type: string
      customerName:
        description: |-
          Customer name/email captured at checkout. Empty until the buyer fills the
          checkout form.
        type: string
      discountCents:
        type: integer
      discountedAmount:
        description: |-
          DiscountedAmount é o que foi abatido por cupom ou desconto de PIX. Sem
          ele a tela mostraria a diferença entre o preço cheio e o que entrou como
          se fosse dívida — que é exatamente o erro que a parcela "DESCONTO" no ERP
          existe para não cometer.
        type: integer
      erpFinalisation:
        $ref: '#/definitions/apps_api_internal_order.ERPFinalisationResponse'
      erpFinalisationStatus:
        description: |-
          Lifecycle of the post-payment Tiny order creation: pending | done | failed.
          Surfaced on the list so the admin can spot "Pedido pago, Tiny falhou" rows
          without opening each one. Values mirror cart.erp_finalisation_status.
        type: string
      erpInvoice:
        $ref: '#/definitions/apps_api_internal_order.ERPInvoiceResponse'
      erpItemSync:
        $ref: '#/definitions/livecart_apps_api_internal_cartedit.Status'
      erpPaymentReview:
        $ref: '#/definitions/livecart_apps_api_internal_erp.PaymentReview'
      erpPendingItems:
        type: integer
      eventId:
        description: |-
          EventID é o id da CAMPANHA. liveSessionId sai com o MESMO valor por
          compatibilidade com o frontend atual — ele nunca carregou um id de
          sessão, sempre foi event_id (RN-19). EventTitle idem: é o título do
          evento, não da transmissão.
        type: string
      eventTitle:
        type: string
      expiresAt:
        type: string
      freeShipping:
        description: |-
          Mirrors the live event's freeShipping flag, used by the list to render
          a "frete grátis" indicator without loading the full event.
        type: boolean
      hasShipping:
        description: |-
          True when the buyer picked a shipping service at checkout. Lets the
          admin list distinguish "buyer never selected anything" from "selected,
          but no shipment row created yet".
        type: boolean
      id:
        type: string
      installments:
        type: integer
      isFirstPurchase:
        description: |-
          True only for the buyer's earliest paid order in this store. Frontend
          renders a "Primeira venda" badge from this flag.
        type: boolean
      items:
        items:
          $ref: '#/definitions/apps_api_internal_order.OrderItemResponse'
        type: array
      itemsPreview:
        description: |-
          Lightweight preview (name/image/qty) so the list can render an avatar
          stack without the full Items array. Populated only on list endpoints.
        items:
          $ref: '#/definitions/apps_api_internal_order.OrderItemPreviewResponse'
        type: array
      livePlatform:
        type: string
      liveSessionId:
        description: 'Deprecated: use eventId.'
        type: string
      liveTitle:
        description: 'Deprecated: use eventTitle.'
        type: string
      notifications:
        description: 'Árvore de histórico (20/08/2026): DMs enviadas e jornada completa
          da fila.'
        items:
          $ref: '#/definitions/apps_api_internal_order.OrderNotificationOutput'
        type: array
      outstandingAmount:
        type: integer
      paidAt:
        type: string
      paidTotalCents:
        type: integer
      payableAmount:
        description: |-
          PayableAmount: só as unidades COM estoque — é o que a cliente consegue
          pagar agora e o valor que o orçamento impresso apresenta. Igual a
          totalAmount quando não há nada em fila.
        type: integer
      paymentMethod:
        description: |-
          Pagamento: método (pix/credit_card/...), parcelas e os valores REAIS do
          pedido. PaidTotalCents é EXATAMENTE o que foi cobrado (com desconto PIX);
          DiscountCents é cupom + desconto PIX. O FE exibe "PIX" / "Cartão · 3x", o
          desconto e o valor pago sem recalcular.
        type: string
      paymentReviewRequired:
        type: boolean
      paymentStatus:
        type: string
      payments:
        description: |-
          Payments é o extrato: uma linha por cobrança, na ordem em que o dinheiro
          entrou. Um pedido pode ser pago em várias vezes enquanto recebe item.
        items:
          $ref: '#/definitions/apps_api_internal_order.OrderPaymentEntryResponse'
        type: array
      shipment:
        $ref: '#/definitions/apps_api_internal_order.OrderShipmentResponse'
      shipmentStatus:
        description: |-
          Latest shipment status (normalized enum). Empty string when the order has
          no shipment yet.
        type: string
      shipping:
        $ref: '#/definitions/apps_api_internal_order.OrderShippingSelectionResp'
      shippingAddress:
        $ref: '#/definitions/apps_api_internal_order.OrderShippingAddressResponse'
      shortId:
        description: |-
          Per-store sequential order number, starts at 1000 in each store. UI shows
          "#{shortId}" to merchants and customers — the UUID stays as the URL key.
        type: integer
      status:
        type: string
      store:
        $ref: '#/definitions/apps_api_internal_order.OrderStoreResponse'
      token:
        description: |-
          Cart token; the public buyer link is `${frontend_origin}/cart/${token}`.
          Detail-only — the list endpoint does not expose this to keep the surface
          area narrow.
        type: string
      totalAmount:
        type: integer
      totalItems:
        type: integer
      waitlist:
        description: |-
          Waitlist são os produtos que a cliente pediu, a loja não tinha e ela
          entrou na fila. Não somam no total nem vão para a transportadora — são o
          que o lojista precisa dizer que está esperando reposição.
        items:
          $ref: '#/definitions/apps_api_internal_order.OrderWaitlistItemResponse'
        type: array
      waitlistJourney:
        items:
          $ref: '#/definitions/apps_api_internal_order.OrderWaitlistJourneyOutput'
        type: array
      waitlistedAmount:
        description: |-
          WaitlistedAmount: valor das unidades em fila, declarado no orçamento como
          não incluído em vez de simplesmente omitido.
        type: integer
