host: localhost:3001
info:
  contact:
    email: support@livecart.com
    name: LiveCart Support
  description: API REST for LiveCart SaaS — live commerce order detection, cart consolidation,
    and integrations.
  license:
    name: Proprietary
  termsOfService: https://livecart.com/terms
  title: LiveCart API
  version: "1.0"
paths:
  /api/public/checkout/{token}/coupon:
    delete:
      parameters:
      - description: Cart token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
      summary: Remove the applied coupon from a public cart
      tags:
      - coupons
    post:
      consumes:
      - application/json
      parameters:
      - description: Cart token
        in: path
        name: token
        required: true
        type: string
      - description: Coupon code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apps_api_internal_coupon.ApplyCouponRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_api_internal_coupon.ApplyResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.ValidationEnvelope'
      summary: Apply a coupon to a public cart
      tags:
      - coupons
  /api/v1/idea-categories:
    get:
      description: Returns the catalog of idea categories (slug + label)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/apps_api_internal_idea.Category'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List idea categories
      tags:
      - ideas
  /api/v1/ideas:
    get:
      description: Returns a paginated, filterable feed of ideas
      parameters:
      - description: Feed tab
        in: query
        name: tab
        type: string
      - description: Category slug filter
        in: query
        name: category
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      - description: Sort order
        in: query
        name: sort
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apps_api_internal_idea.ListIdeasResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: List ideas feed
      tags:
      - ideas
    post:
      consumes:
      - application/json
      description: Proposes a new idea in the ideas channel
      parameters:
      - description: Idea to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apps_api_internal_idea.CreateIdeaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_api_internal_idea.IdeaResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.ValidationEnvelope'
      security:
      - BearerAuth: []
      summary: Create idea
      tags:
      - ideas
  /api/v1/ideas/{id}:
    get:
      description: Returns a single idea with its threaded comments
      parameters:
      - description: Idea ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_api_internal_idea.IdeaDetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: Get idea detail
      tags:
      - ideas
  /api/v1/ideas/{id}/comments:
    post:
      consumes:
      - application/json
      description: Posts a comment or reply on an idea
      parameters:
      - description: Idea ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apps_api_internal_idea.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_api_internal_idea.CommentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "404":
          description: Not Found
          schema:
