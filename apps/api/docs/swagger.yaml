  apps_api_internal_live.CreateLiveRequest:
    properties:
      cartExpirationMinutes:
        description: |-
          min=15 espelha o CHECK da migration 000106. Estava em 5 e um valor entre
          5 e 14 passava na validação e estourava no banco como 500 (lição E6).
          Teto de 30 dias (43200) — era 1440 e limitava todo carrinho a 24h.
        maximum: 43200
        minimum: 15
        type: integer
      cartMaxQuantityPerItem:
        maximum: 100
        minimum: 1
        type: integer
      closeCartOnEventEnd:
        description: Cart settings (override store defaults)
        type: boolean
      description:
        maxLength: 2000
        type: string
      endsAt:
        type: string
      mediaCaption:
        type: string
      mediaPermalink:
        description: |-
          Metadados da publicação escolhida como PRIMEIRA transmissão, no mesmo
          formato de CreatePostRequest e CreateSessionRequest. Sem eles, a MESMA
          publicação ficava com permalink/capa/legenda quando entrava pelo caminho
          de evento-de-post e sem nada quando entrava pelo formulário de campanha —
          duas portas para o mesmo dado, só uma alimentando a tela.
        type: string
      mediaThumbnailUrl:
        type: string
      pixDiscountPercent:
        description: PixDiscountPercent (0-100). 0 disables the feature.
        maximum: 100
        minimum: 0
        type: integer
      platform:
        enum:
        - instagram
        type: string
      platformLiveId:
        type: string
      scheduledAt:
        description: Scheduling
        type: string
      sendOnLiveEnd:
        type: boolean
      startsAt:
        description: |-
          StartsAt/EndsAt são a JANELA COMERCIAL do evento (D21). EndsAt é
          OBRIGATÓRIO (RN-05/CA-05.1): é o teto que garante que nenhum carrinho
          fica órfão, já que a RN-04 mantém expires_at NULL durante o evento.
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
      type:
        description: |-
          Type é o tipo da PRIMEIRA SESSÃO, não do evento. O evento é a campanha e
          não tem espécie desde a 000122 — quem tem live na segunda e story na
          quinta não tem resposta única para "que tipo é este evento".

          'single'/'multi' são o vocabulário LEGADO ("uma live ou várias
          plataformas"), que a API pública e a skill de E2E ainda mandam; os dois
          caem em 'live' por SessionTypeFromEventType. Continuam aceitos para não
          quebrar chamador nenhum.

          live|post|reel|story é o vocabulário REAL da sessão (o CHECK
          live_sessions_type_check da 000111). Aceitá-los aqui é o que destrava
          "criar a campanha e já pendurar a primeira transmissão do tipo certo" sem
          passar pelo formulário de post — antes, um evento criado por esta rota
          nascia sempre com sessão 'live', qualquer que fosse a intenção.
          Omitido = 'live', o default histórico.
        enum:
        - single
        - multi
        - live
        - post
        - reel
        - story
        type: string
      waitlistNotifiedTtlMinutes:
        description: Prazo extra para quem ainda aguarda estoque no encerramento (0
          a 30 dias).
        maximum: 43200
        minimum: 0
        type: integer
    required:
    - endsAt
    - title
    type: object
  apps_api_internal_live.CreateLiveResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      platform:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  apps_api_internal_live.CreatePostRequest:
    properties:
      cartExpirationMinutes:
        description: |-
          min=15 espelha o CHECK da migration 000106; abaixo disso o INSERT vira
          500 em vez de erro de campo (lição E6 da errata). Teto de 30 dias
          (43200): o antigo 1440 era o motivo de "carrinho não pode durar mais de
          24h" — pedido do cliente em 20/08/2026.
        maximum: 43200
        minimum: 15
        type: integer
      cartMaxQuantityPerItem:
        maximum: 100
        minimum: 1
        type: integer
      endsAt:
        description: |-
          EndsAt é OBRIGATÓRIO (RN-05/CA-05.1). Sem teto, a RN-04 (expires_at NULL
          durante o evento) deixa o carrinho sem prazo para sempre.
        type: string
      mediaCaption:
        type: string
      mediaId:
        type: string
      mediaPermalink:
        type: string
      mediaThumbnailUrl:
        type: string
      productIds:
        items:
          type: string
        minItems: 1
        type: array
      startsAt:
        type: string
      title:
        type: string
      type:
        description: |-
          Type é a espécie da MÍDIA escolhida no grid do painel: 'post' (feed),
          'reel' ou 'story'. Omitido = 'post', que era o comportamento fixo até
          aqui — e é por isso que todo Reel selecionado no grid nascia como sessão
          'post', enquanto o MESMO Reel publicado pelo LiveCart nascia 'reel'
          (integration.publishInstagramReelEvent já manda SessionTypeReel). Duas
          mídias idênticas com tipos diferentes conforme a porta de entrada, e o
          rótulo errado vazando para a métrica por transmissão e para a DM do
          comprador (SessionLabel).
          Os valores espelham o CHECK live_sessions_type_check da 000111 menos
          'live': esta rota mapeia publicação já existente, e publicação não é live.
        enum:
        - post
        - reel
        - story
        type: string
    required:
    - endsAt
    - mediaId
    - productIds
    type: object
  apps_api_internal_live.CreateSessionRequest:
    properties:
      mediaCaption:
        type: string
      mediaPermalink:
        description: |-
          Metadados da publicação, gravados NA MÍDIA (live_session_platforms), do
          mesmo jeito que CreatePostEvent faz. Sem isto, a MESMA publicação ficava
          com permalink/thumbnail/legenda quando entrava como evento novo e sem
          nada quando entrava como sessão de um evento existente — dois caminhos
          paralelos, só um alimentando a tela.
        type: string
      mediaThumbnailUrl:
        type: string
      platform:
        description: |-
          Platform/PlatformLiveID são OPCIONAIS — e o par tem de vir junto ou não
          vir (o service recusa a metade).

          Eram `required`, e isso fechava o caso central da campanha guarda-chuva:
          "marco a Semana Black hoje e penduro a live de segunda quando ela
          existir". Sem mídia não havia como criar a transmissão, embora o banco
          sempre tenha aceitado sessão sem plataforma (é o mesmo caminho que
          CreateEventWithSessionTx já usa quando o lojista ainda não tem o id).
          A sessão nasce sem captura nenhuma e passa a capturar quando a mídia for
          vinculada por POST /lives/:id/sessions/:sessionId/platforms
          (LinkSessionMedia) — a rota ancorada na SESSÃO. Não use
          POST /lives/:id/platforms para isso: ela escolhe a sessão sozinha e, em
          campanha com mais de uma transmissão, vincula a errada em silêncio.
        enum:
        - instagram
        - tiktok
        - youtube
        - facebook
        type: string
      platformLiveId:
        type: string
      productIds:
        description: |-
          ProductIDs é a lista de produtos que ESTA transmissão vende. Opcional:
          vazia significa "vende qualquer produto ativo da loja", que é como toda
          sessão nascia antes.

          O caminho já existia inteiro do service para baixo — CreateSessionInput
          tem o campo e CreateSessionWithPlatformTx grava sessão e whitelist na
          MESMA transação. Só o DTO da borda não expunha, então o painel era
          obrigado a criar a sessão e depois adicionar produto por produto por
          POST /whitelist: uma falha no meio deixava a transmissão no ar vendendo
          o catálogo inteiro, que é o oposto do que o lojista pediu.
        items:
          type: string
        type: array
      type:
        description: |-
          Type é a natureza da transmissão (D3). Vazio = "live". Os valores aqui
          espelham o CHECK live_sessions_type_check da 000111: desalinhar os dois
          devolve 500 em vez de 422 (lição E6 da errata).
        enum:
        - live
        - post
        - reel
        - story
        type: string
    type: object
  apps_api_internal_live.EndLiveRequest:
    properties:
      sendOnLiveEnd:
        type: boolean
    type: object
  apps_api_internal_live.EndLiveResponse:
    properties:
      autoSendLinks:
        type: boolean
