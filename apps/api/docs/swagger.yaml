  /api/v1/stores/{storeId}/orders/{id}/cancel:
    post:
      description: |-
        Cancela um pedido que ainda não foi pago: o carrinho continua
        existindo com status 'cancelled', o estoque local é devolvido, a
        reserva/pedido no ERP (Tiny) é estornada e a fila de espera do
        carrinho é encerrada. O link público passa a mostrar "carrinho
        cancelado" (e não "expirado"). Recusa com 409 quando o pedido já
        foi pago, já está cancelado/expirado, ou quando um pagamento
        está sendo finalizado neste instante — nessa corrida o pagamento
        vence e o pedido permanece pago.
      parameters:
      - description: Store UUID
        in: path
        name: storeId
        required: true
        type: string
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_api_internal_order.OrderDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/livecart_apps_api_lib_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: Cancelar carrinho/pedido não pago
      tags:
      - orders
